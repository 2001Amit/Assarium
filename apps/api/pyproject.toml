[tool.poetry]
name = "assarium-api"
version = "0.1.0"
description = "Assarium self-serve data platform API"
authors = ["Assarium"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
sqlalchemy = "^2.0.36"
cryptography = "^43.0.0"
duckdb = "^1.1.3"
pyarrow = "^18.0.0"
pandas = "^2.2.3"
httpx = "^0.27.2"
python-multipart = "^0.0.12"
openai = "^2.0.0"
azure-identity = "^1.19.0"
sqlglot = "^25.30.0"

# Connector drivers are optional so a laptop install never breaks on a native build.
psycopg = { extras = ["binary"], version = "^3.2.3", optional = true }
pymysql = { version = "^1.1.1", optional = true }
pymssql = { version = "^2.3.2", optional = true }
snowflake-connector-python = { version = "^3.12.3", optional = true }
google-cloud-bigquery = { version = "^3.27.0", optional = true }
databricks-sql-connector = { version = "^3.6.0", optional = true }
databricks-sdk = { version = "^0.38.0", optional = true }
azure-storage-file-datalake = { version = "^12.17.0", optional = true }
boto3 = { version = "^1.35.60", optional = true }
msal = { version = "^1.31.0", optional = true }
simple-salesforce = { version = "^1.12.6", optional = true }
openpyxl = { version = "^3.1.5", optional = true }

[tool.poetry.extras]
postgres = ["psycopg"]
mysql = ["pymysql"]
mssql = ["pymssql"]
snowflake = ["snowflake-connector-python"]
bigquery = ["google-cloud-bigquery"]
databricks = ["databricks-sql-connector", "databricks-sdk"]
adls = ["azure-storage-file-datalake"]
s3 = ["boto3"]
sharepoint = ["msal"]
salesforce = ["simple-salesforce"]
files = ["openpyxl"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
ruff = "^0.7.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are call-in-default by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Form",
]
